<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="60%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- 궤도들 -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="#00d2ff" stroke-width="4" opacity="0.6" transform="rotate(30 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="#ff6b81" stroke-width="4" opacity="0.6" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="#ffbe3b" stroke-width="4" opacity="0.6" transform="rotate(90 256 256)"/>

  <!-- 전자들 -->
  <circle cx="100" cy="180" r="14" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="410" cy="330" r="14" fill="#ff6b81" filter="url(#glow)"/>
  <circle cx="256" cy="76" r="14" fill="#ffbe3b" filter="url(#glow)"/>

  <!-- 원자핵 -->
  <circle cx="256" cy="256" r="48" fill="url(#nucleus)" filter="url(#glow)"/>
  <text x="256" y="270" font-family="Arial, sans-serif" font-weight="900" font-size="40" fill="#ffffff" text-anchor="middle">118</text>
</svg>
